# Baut ToDo-Listwerk für macOS (Universal: Apple Silicon und Intel), ad-hoc signiert.
# Jeder Push auf main: Build als Artefakt. Tag „v*“: zusätzlich GitHub-Release mit ZIP und DMG.
name: macOS-Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Übersetzungen prüfen
        run: python3 scripts/check_translations.py

      - name: Kern testen (swift test)
        continue-on-error: true
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Testfehler melden
        if: always()
        run: |
          [ -f test.log ] || exit 0
          grep -E "error:|failed \(" test.log | sort -u | head -10 | while IFS= read -r l; do echo "::warning title=Test::$l"; done
          grep -E "Executed [0-9]+ tests" test.log | tail -1 | while IFS= read -r l; do echo "::notice title=Tests::$l"; done

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen

      - name: App bauen
        run: |
          set -o pipefail
          xcodebuild -project Listwerk.xcodeproj -scheme Listwerk-macOS -configuration Release \
            -derivedDataPath build/dd -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS="" build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d "build/dd/Build/Products/Release/ToDo-Listwerk.app"
      - name: Compilerfehler melden
        if: failure()
        run: |
          grep -E ": error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error title=Compiler::$l"; done

      - name: Signieren und verpacken
        run: |
          APP="build/dd/Build/Products/Release/ToDo-Listwerk.app"
          codesign --force --deep --options runtime --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION=$(defaults read "$PWD/$APP/Contents/Info.plist" CFBundleShortVersionString)
          echo "::notice title=Version::ToDo-Listwerk $VERSION ($(lipo -archs "$APP/Contents/MacOS/ToDo-Listwerk"))"
          mkdir -p dist dmg
          ditto -c -k --keepParent "$APP" "dist/ToDo-Listwerk-$VERSION-macOS.zip"
          ditto "$APP" dmg/ToDo-Listwerk.app
          ln -s /Applications dmg/Programme
          hdiutil create -volname "ToDo-Listwerk" -srcfolder dmg -ov -format UDZO "dist/ToDo-Listwerk-$VERSION-macOS.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ToDo-Listwerk-macOS
          path: dist/*

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "ToDo-Listwerk $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
